[project]
name = "nimble-skills-evals"
version = "0.1.0"
description = "CLI evaluation harness for nimble-web-expert against assistant production prompts"
requires-python = ">=3.11"
dependencies = [
  "langfuse>=2.0.0,<4",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "bashlex>=0.18",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]

[tool.uv]
package = true

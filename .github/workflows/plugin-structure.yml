name: Plugin structure

# Marketplace ingestion is stricter than runtime discovery, and in the direction that
# hides mistakes: Claude Code and Codex both discover skills recursively, so a nested
# skill or a reference document named SKILL.md works perfectly on a developer's machine
# while OpenAI rejects the submission (skill_manifest_nested) and xAI silently omits
# every skill from its index. Nothing local surfaces either failure, so it is gated here.
#
# The assertion lives in scripts/check-plugin-structure.sh so the same code runs locally.
#
# The check needs no secrets and makes no network calls. It runs on `pull_request`
# (not `pull_request_target`) with a read-only token, so a fork PR cannot reach
# anything privileged.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: plugin-structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Skills tree is packageable on every platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA rather than a mutable tag, so a retagged or
      # compromised release cannot silently run new code. Update deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify plugin structure
        run: bash scripts/check-plugin-structure.sh

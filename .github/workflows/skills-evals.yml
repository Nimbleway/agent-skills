name: Skills production evals

# Manual dispatch — runs nimble-web-expert against Langfuse nimble-web-expert-production.
# Prompts never appear in this repo; CI must use Langfuse secrets.
# Prefer redacted summaries only (item ids + metric rates). Do not upload prompt-bearing
# artifacts on public forks.

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: "CLI runtime"
        type: choice
        options: [claude, codex, both]
        default: claude
      max_items:
        description: "Stratified sample size (empty = full dataset)"
        type: string
        default: "50"
      tag:
        description: "Optional metadata tag filter (e.g. extraction-templates)"
        type: string
        default: ""
      check_regression:
        description: "Enforce first_turn_action regression gate"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: skills-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: nimble-web-expert production (${{ inputs.runtime }})
    runs-on: ubuntu-latest
    # Deliberate job ceilings (not inherited): empty max_items = full ~489-item
    # dataset needs up to ~6h; sampled runs (default 50) cap at 4h. Per-item
    # harness timeout (600s) bounds a hung CLI; cancel-in-progress drops
    # superseded dispatches.
    timeout-minutes: ${{ inputs.max_items == '' && 360 || 240 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require secrets
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          NIMBLE_API_KEY: ${{ secrets.NIMBLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          require() {
            local name="$1"
            local value="$2"
            if [[ -z "${value}" ]]; then
              missing+=("${name}")
            fi
          }
          require LANGFUSE_PUBLIC_KEY "${LANGFUSE_PUBLIC_KEY}"
          require LANGFUSE_SECRET_KEY "${LANGFUSE_SECRET_KEY}"
          require NIMBLE_API_KEY "${NIMBLE_API_KEY}"
          runtime="${{ inputs.runtime }}"
          if [[ "${runtime}" == "claude" || "${runtime}" == "both" ]]; then
            if [[ -z "${ANTHROPIC_API_KEY}" && -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]]; then
              missing+=("ANTHROPIC_API_KEY|CLAUDE_CODE_OAUTH_TOKEN")
            fi
          fi
          if [[ "${runtime}" == "codex" || "${runtime}" == "both" ]]; then
            require OPENAI_API_KEY "${OPENAI_API_KEY}"
          fi
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing required GitHub Actions secrets for runtime=${runtime}: ${missing[*]}"
            echo "Set them under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "Required secrets present for runtime=${runtime}"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Sync eval package
        working-directory: evals
        run: uv sync

      # Pinned npm installs (no curl|bash). Bump versions intentionally.
      - name: Install Claude Code + Nimble CLI
        if: inputs.runtime == 'claude' || inputs.runtime == 'both'
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code@2.1.223 @nimble-way/nimble-cli@1.2.0
          command -v claude
          command -v nimble

      - name: Install Codex + Nimble CLI
        if: inputs.runtime == 'codex' || inputs.runtime == 'both'
        run: |
          set -euo pipefail
          npm install -g @openai/codex@0.146.1 @nimble-way/nimble-cli@1.2.0
          command -v codex
          command -v nimble
          codex --version

      # Codex ignores process-env OPENAI_API_KEY for exec; it only uses
      # $CODEX_HOME/auth.json from `codex login --with-api-key`.
      - name: Authenticate Codex
        if: inputs.runtime == 'codex' || inputs.runtime == 'both'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.codex"
          printenv OPENAI_API_KEY | codex login --with-api-key
          test -s "${HOME}/.codex/auth.json"
          codex login status
          # Fail fast if the key cannot call the Responses API.
          # Capture status without aborting under set -e so diagnostics always run.
          set +e
          codex exec \
            --skip-git-repo-check \
            --ignore-user-config \
            --ephemeral \
            --dangerously-bypass-approvals-and-sandbox \
            -C "${RUNNER_TEMP:-/tmp}" \
            -- 'reply with exactly OK' \
            > /tmp/codex-auth-probe.txt 2>&1
          probe_rc=$?
          set -e
          if [[ "${probe_rc}" -ne 0 ]] || ! grep -q 'OK' /tmp/codex-auth-probe.txt; then
            echo "::error::Codex auth probe failed (exit ${probe_rc}; expected reply OK). OPENAI_API_KEY may be invalid."
            sed -n '1,40p' /tmp/codex-auth-probe.txt
            exit 1
          fi
          echo "Codex auth probe OK"

      - name: Run production eval
        working-directory: evals
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST || 'https://us.cloud.langfuse.com' }}
          NIMBLE_API_KEY: ${{ secrets.NIMBLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_CONCURRENCY: "4"
        run: |
          set -euo pipefail
          ARGS=(--dataset-name=nimble-web-expert-production --runtime "${{ inputs.runtime }}")
          if [[ -n "${{ inputs.max_items }}" ]]; then
            ARGS+=(--max-items "${{ inputs.max_items }}")
          fi
          if [[ -n "${{ inputs.tag }}" ]]; then
            ARGS+=(--tag "${{ inputs.tag }}")
          fi
          if [[ "${{ inputs.check_regression }}" == "true" ]]; then
            ARGS+=(--check-regression)
          fi
          uv run python -m evals.suites.web_expert "${ARGS[@]}"

      - name: Summarize scores (redacted)
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          results = Path.home() / ".nimble" / "skills-evals" / "results"
          files = sorted(results.glob("*_results.json")) if results.is_dir() else []
          if not files:
              print("No results JSON found")
              sys.exit(0)
          for path in files:
              rows = json.loads(path.read_text())
              print(f"### {path.name} (n={len(rows)})")
              metrics = ["first_turn_action", "skill_selection", "tool_selection", "forbidden_tools"]
              for m in metrics:
                  vals = []
                  for r in rows:
                      if r.get("error"):
                          continue
                      s = (r.get("scores") or {}).get(m) or {}
                      v = s.get("value")
                      if isinstance(v, bool):
                          vals.append(float(v))
                  if vals:
                      print(f"- {m}: {sum(vals)/len(vals):.3f} ({sum(vals):.0f}/{len(vals)})")
                  else:
                      print(f"- {m}: n/a")
              fails = [r for r in rows if (r.get("scores") or {}).get("first_turn_action", {}).get("value") is False]
              print(f"- first_turn_action failures (ids only): {[r.get('id') for r in fails[:20]]}")
          PY
